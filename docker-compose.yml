services:
  backend:
    build:
      context: ./backend
    container_name: ops-backend
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://backend:8000
    container_name: ops-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
